name: PR tests

# The test gate for pull requests (#161, #184): every PR builds the engine and the editor on Windows and macOS and
# runs the headless tests — native (audio, physics, particles, navigation, primitive geometry) and managed (Vortex.Core:
# asset library, store, Sound Studio, Claude chat loop, .mcp.json). Docs-only changes skip the build jobs (a skipped
# job counts as passed for a required check). The full editor smoke suite needs a GPU and runs on developer machines.
# Since #311 the Windows job is CMake + dotnet only — no MSBuild, no .NET Framework, no WPF editor.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          # docs are not code (the documentation itself lives in the docs website's repository)
          if echo "$changed" | grep -qvE '^(docs/|README|ROADMAP|CHANGELOG|.*\.md$|Templates/.*\.(png|jpg|webp)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # only what the build and the smoke need: the Streamline headers (DX12Streamline.cpp) and the Default 3D template
      - name: Submodules (Streamline headers, Default 3D template)
        run: git submodule update --init --depth 1 ThirdParty/Streamline Templates/Default3D

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Native engine through CMake (DX12 + Jolt)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build/windows-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release -DVORTEX_BUILD_TESTS=OFF || exit /b 1
          cmake --build build/windows-ninja --target VortexAPI || exit /b 1

      # x64\Release is the layout the staging script, the smoke and the installer expect: the engine DLL from the CMake
      # build plus the native DLLs it loads (Assimp; Streamline is optional and comes from Redist when prepared).
      - name: Native binaries into x64/Release
        shell: pwsh
        run: |
          $src = "build/windows-ninja/bin/VortexAPI.dll"
          if (-not (Test-Path $src)) { Write-Error "no CMake VortexAPI.dll"; exit 1 }
          New-Item -ItemType Directory -Force "x64/Release" | Out-Null
          Copy-Item -Force $src "x64/Release/VortexAPI.dll"
          Copy-Item -Force "ThirdParty/assimp6/bin/assimp-vc143-mt.dll" "x64/Release/"
          Get-ChildItem "build/windows-ninja/bin" -Filter "*.dll" | Where-Object { $_.Name -ne "VortexAPI.dll" } | Copy-Item -Destination "x64/Release/" -Force
          if (Test-Path "Redist/Streamline/x64") { Get-ChildItem "Redist/Streamline/x64" -Filter "*.dll" | Copy-Item -Destination "x64/Release/" -Force }
          Write-Host "x64/Release: $((Get-ChildItem x64/Release -Filter *.dll | ForEach-Object Name) -join ', ')"

      - name: Build the managed layer (Vortex.Core, Player, Avalonia editor)
        run: dotnet build Managed/Vortex.Managed.slnx -c Release -v minimal

      - name: The docs website (the core tests compile its C# samples)
        shell: bash
        run: bash tools/fetch-docs.sh "$RUNNER_TEMP/docs-site"

      - name: Managed tests (Vortex.Core)
        env:
          VORTEX_DOCS_DIR: ${{ runner.temp }}/docs-site
        run: dotnet run --project Managed/Vortex.Core.Tests -c Release

      # The Windows editor (#183) exactly as the installer lays it out — {app}\Editor (self-contained, with its player)
      # next to {app}\VortexAPI.dll, Shaders and Templates, outside the repository — on DX12 / WARP (the runners have no
      # GPU): viewport input, scenes, export, tools, captures and the Claude panel end to end.
      - name: Editor smoke, installed layout (DX12 / WARP)
        shell: pwsh
        env:
          VORTEX_DX12_WARP: '1'
          VORTEX_SMOKE_FULL: '1'
          VORTEX_SMOKE_ONLY: 'mcp,claude,title bar,update window,terminal,workspace layout,camera clip planes,sky texture,height fog,material pipelines,light priority,tool arguments,resource lifecycle,cutout shadows,instance tint,import handedness,jolt character,behavior tree,particles,decals,volumetric fog,terrain,foliage,water'
        run: |
          $tmp = $env:RUNNER_TEMP
          $app = "$tmp\app"
          tools/windows/stage-editor.ps1 -Out "$app\Editor"
          Copy-Item x64\Release\*.dll $app
          Copy-Item -Recurse Engine\Shaders "$app\Shaders"
          New-Item -ItemType Directory -Force "$app\Templates" | Out-Null
          Copy-Item -Recurse Templates\Default3D "$app\Templates\Default3D"
          $env:VORTEX_APPDATA_DIR = "$tmp\appdata"
          Copy-Item -Recurse Templates/Default3D "$tmp\smoke-project"
          $exe = "$app\Editor\Vortex.Editor.exe"
          $p = Start-Process $exe -ArgumentList "--project=$tmp\smoke-project", "--smoke=25", "--capture=$tmp\capture" -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$tmp\smoke.log" -RedirectStandardError "$tmp\smoke.err"
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Host "::warning::the editor smoke timed out" }
          Get-Content "$tmp\smoke.log" -ErrorAction SilentlyContinue
          Get-Content "$tmp\smoke.err" -ErrorAction SilentlyContinue
          # the logs travel with the capture artifact: a failure can be read from the artifact alone (no job-log access needed)
          New-Item -ItemType Directory -Force "$tmp\capture" | Out-Null
          Copy-Item "$tmp\smoke.log" "$tmp\capture\smoke.log" -ErrorAction SilentlyContinue
          Copy-Item "$tmp\smoke.err" "$tmp\capture\smoke.err" -ErrorAction SilentlyContinue
          if (Select-String -Path "$tmp\smoke.log" -Pattern "SMOKE FAIL" -Quiet) { exit 1 }
          foreach ($c in @("mcp tools", "title bar", "terminal", "workspace layout", "camera clip planes", "sky texture", "height fog", "material pipelines", "light priority", "tool arguments", "resource lifecycle", "cutout shadows", "instance tint", "import handedness", "jolt character", "behavior tree", "particles", "decals", "volumetric fog", "terrain", "foliage", "water")) { if (-not (Select-String -Path "$tmp\smoke.log" -Pattern "SMOKE OK   $c" -Quiet)) { Write-Host "::error::smoke check '$c' did not pass"; exit 1 } }
          if (-not (Select-String -Path "$tmp\smoke.log" -Pattern "Jolt world ready" -Quiet)) { Write-Host "::error::the editor ran with the physics stub — no 'Jolt world ready' in the smoke log (#182)"; exit 1 }

      - name: Upload the Windows smoke capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-capture
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: brew install ninja assimp sdl3

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure (Release)
        run: cmake --preset macos-release

      - name: Build engine, SDL GPU renderer, VortexAPI, native tests
        run: cmake --build --preset macos-release

      - name: Native tests (audio, physics, particles, navigation, geometry)
        run: ctest --preset macos-release --output-on-failure

      - name: Build the managed layer (Vortex.Core, Player, Avalonia editor)
        run: dotnet build Managed/Vortex.Managed.slnx -c Release -v minimal

      - name: The docs website (the core tests compile its C# samples)
        shell: bash
        run: bash tools/fetch-docs.sh "$RUNNER_TEMP/docs-site"

      - name: Managed tests (Vortex.Core)
        env:
          VORTEX_DOCS_DIR: ${{ runner.temp }}/docs-site
        run: dotnet run --project Managed/Vortex.Core.Tests -c Release
